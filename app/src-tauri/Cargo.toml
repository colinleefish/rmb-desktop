[package]
name = "rmb-app"
version = "0.1.17"
description = "rmb desktop app"
authors = ["colinleefish"]
license = ""
repository = ""
default-run = "rmb-app"
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5.5", features = [] }

[dependencies]
dirs = "6"
libc = "0.2"
open = "5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tauri = { version = "1.8.1", features = ["system-tray"] }
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
