# Golden retrieval set for the recall eval harness (issue #22).
#
# Provenance of questions:
#   - audit-*, typo-*, xling-*: the 2026-08-22 retrieval audit's 8 golden
#     questions plus its two adversarial probes
#     (docs/audit/2026-08-22-memory-retrieval-audit/treasure-hunter-retrieval-stress-test.md).
#   - live-*: written from raw session_turns sampled read-only across the
#     ~20-day window (INCLUDING the backfill period, back to 2026-06-09),
#     BEFORE inspecting which memories were distilled; expected URIs were
#     then pinned by verifying each against the distilled store.
#
# Gates are the v1 baseline (recorded from a local full run). The eval fails
# when aggregate metrics regress past these.
gates:
  # v1 baseline (deterministic hash-embedder, fixture subset): observed
  # recall@5=0.545 dup-rate=0.000 recency-precision=1.000 on 22 questions.
  # Gates are set at/below baseline so the eval fails only on real regressions
  # from HEAD. The live production embedder scores higher; these numbers are
  # a conservative lower bound (see package doc on the accuracy tradeoff).
  min_recall_at_5: 0.50
  max_dup_rate: 0.30
  min_recency_precision: 0.50

questions:
